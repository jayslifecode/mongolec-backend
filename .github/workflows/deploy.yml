name: Deploy Backend to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ghcr.io/jayslifecode/mongolec-backend:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          envs: GHCR_TOKEN,GHCR_USERNAME,B2_ENDPOINT,B2_REGION,B2_ACCESS_KEY_ID,B2_SECRET_ACCESS_KEY,B2_BUCKET_NAME,CORS_ORIGIN,COOKIE_DOMAIN,POSTGRES_PASSWORD,REDIS_PASSWORD,JWT_SECRET,ENCRYPTION_KEY
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            cd ~/apps/mongolec-backend

            for var in B2_ENDPOINT B2_REGION B2_ACCESS_KEY_ID B2_SECRET_ACCESS_KEY B2_BUCKET_NAME CORS_ORIGIN COOKIE_DOMAIN POSTGRES_PASSWORD REDIS_PASSWORD JWT_SECRET ENCRYPTION_KEY; do
              value=$(eval echo "\$$var")
              if grep -q "^${var}=" .env; then
                sed -i "s#^${var}=.*#${var}=${value}#" .env
              else
                echo "${var}=${value}" >> .env
              fi
            done

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d --force-recreate

            # Each deploy leaves the previous backend image (~700 MB) behind. Remove images that no
            # container uses, or the 14 GB disk fills up (it did on 2026-11-25 and a deploy failed).
            docker image prune -a -f
            df -h /
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
